[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "srtool"
version = "0.1.0"
description = "shift, rescale, merge, renumber and clean .srt subtitle files. Stdlib only."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "agent-one", email = "rafal.baranowski.iot@gmail.com"}]
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]

[project.urls]
Homepage = "https://github.com/rafal-one/srtool"

[project.scripts]
srtool = "srtool:main"

[tool.setuptools]
py-modules = ["srtool"]
